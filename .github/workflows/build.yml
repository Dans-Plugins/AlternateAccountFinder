name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      # Every Bukkit class, field and method the jar uses must exist on each Minecraft
      # version in minecraft-versions.json, and its bytecode must fit the Java each runs on.
      # See https://github.com/Dans-Plugins/release-gates#api-compatibility-check
      - name: Check Bukkit API use against every supported Minecraft version
        run: |
          curl -fsSL -o /tmp/check_api_compat.py \
            https://raw.githubusercontent.com/Dans-Plugins/release-gates/v12/gates/check_api_compat.py
          python3 /tmp/check_api_compat.py --versions minecraft-versions.json target build/libs
