# Usage reporting. When the plugin is enabled, and each time one of its
# commands is used, a small event (plugin name, event name, plugin version)
# is sent to the author's trace server so it is known which plugins are
# actually in use. Nothing about players or the server is included. Sending
# happens off the main thread, never blocks a tick, and is dropped silently
# if the server cannot be reached. Set enabled to false to turn it off.
#
# To turn it off for every plugin on this server at once, set enabled: false
# in plugins/trace/config.yml (created on first start and never turned back
# on by a plugin). The environment variables TRACE_USAGE_REPORTING=off and
# DO_NOT_TRACK=1 turn it off for the whole server process. The plugin says
# on every startup whether reporting is on and why not, if it is off.
# Details: https://github.com/Stephenson-Software/trace#usage-reporting
usage-reporting:
  enabled: true
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to AlternateAccountFinder and can be revoked as a group if they
  # are ever abused. It is not a secret -- it ships in this file on every
  # server that runs the plugin -- and it cannot do anything except report as
  # this plugin. Empty means reporting is off regardless of the switch above.
  key: "1l1DZ2blqwQQibQakphlYzopU7X-JOx8XBtIE5ucHDY"
